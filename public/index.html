<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3158de"><meta name="description" content="提交需求和问题，查看每一条反馈的处理进展。"><title>提交反馈 · 每个声音都有回响</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./config.js" defer></script><script src="./app.js" type="module"></script></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="提交反馈首页"><span class="brand-icon">f<span>·</span></span>提交反馈</a><span class="header-note">倾听 · 记录 · 改进</span></header>
<main>
<section class="intro"><p>遇到问题或有好想法？告诉我们。</p></section>

<section class="submit-panel" aria-labelledby="submit-title">
<h1 id="submit-title" class="sr-only">提交反馈</h1>
<form id="feedback-form">
<div class="nickname-field"><label class="field-label" for="nickname">昵称 <span class="optional">选填</span></label><input id="nickname" name="nickname" type="text" maxlength="20" autocomplete="name" placeholder="怎么称呼你？不填则显示匿名访客" aria-describedby="nickname-help"><p id="nickname-help" class="nickname-help">当前浏览器会记住昵称，下次自动填写。昵称可以重复，访客编号用于区分。</p></div>
<div class="selection-row"><div class="site-field"><span class="field-label" id="site-label">站点 <span class="required">*</span></span><div class="site-select" id="site-select"><input id="site" name="site" type="hidden" value="拾萤"><button id="site-trigger" class="site-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="site-options" aria-labelledby="site-label site-value"><img id="site-icon" class="site-icon" src="./site-icons/firepick.png" alt="" width="32" height="32"><span id="site-value">拾萤</span><svg class="site-chevron" viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true"><path d="m5 7 5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="site-options" class="site-options" role="listbox" aria-labelledby="site-label" hidden></div></div></div>
<div class="type-field"><span class="field-label" id="type-label">类型 <span class="required">*</span></span><div class="site-select" id="type-select"><input id="type" name="type" type="hidden" value="需求"><button id="type-trigger" class="site-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="type-options" aria-labelledby="type-label type-value"><span id="type-icon" class="site-icon type-icon type-requirement" aria-hidden="true">✦</span><span id="type-value">需求</span><svg class="site-chevron" viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true"><path d="m5 7 5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="type-options" class="site-options" role="listbox" aria-labelledby="type-label" hidden></div></div></div></div>
<label class="field-label" for="description">反馈描述 <span class="required">*</span></label>
<textarea id="description" name="description" rows="5" maxlength="5000" required placeholder="请描述你的需求或遇到的问题。若是问题，建议补充操作步骤和预期结果。" aria-describedby="description-count"></textarea><div class="field-meta"><span>请勿填写密码、密钥或其他敏感信息。</span><span id="description-count">0 / 5000</span></div>

<div class="attachment-field"><label class="field-label" for="attachments">上传附件 <span class="optional">选填</span></label><label class="upload-area" for="attachments"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 12.5 14.5 6a3 3 0 0 1 4.2 4.2L10 19a5 5 0 0 1-7-7l9-9"/><path d="m6.5 14 8-8"/></svg><span><strong><span class="upload-desktop">点击上传，或将文件拖到这里</span><span class="upload-mobile">选择图片或文件</span></strong><small>图片、PDF、TXT、日志或 ZIP · 最多 5 个，共 10 MB</small></span><input id="attachments" name="attachments" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.log,.zip"></label><ul id="file-list" class="file-list"></ul></div>
<div class="form-bottom"><div class="default-status"><span class="status pending">待处理</span><span>提交后的初始状态，处理结果由维护者更新</span></div><button class="primary-button" id="submit-button" type="submit">提交反馈</button></div>
<p class="public-note">昵称、访客编号、反馈描述与附件会公开展示，请勿上传私人资料。</p><p id="form-message" class="form-message" role="status" aria-live="polite"></p>
<div class="honey" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
</form></section>
<section class="feedback-section" aria-labelledby="list-title"><div class="list-heading"><div><h2 id="list-title">反馈记录 <span id="total-count" class="count">0</span></h2><p>每一条反馈，都值得被认真对待。</p></div><button class="refresh-button" id="refresh" type="button">↻ 刷新列表</button></div>
<form id="record-search-form" class="record-search" role="search" aria-label="查询反馈记录"><label class="sr-only" for="record-query">查询反馈记录</label><input id="record-query" name="query" type="search" maxlength="100" autocomplete="off" placeholder="输入反馈编号、昵称、站点或内容" aria-controls="feedback-list"><button class="query-button" type="submit">查询</button><button id="clear-query" class="clear-query" type="button" hidden>清除</button></form>
<div class="list-toolbar"><div class="filters" role="group" aria-label="筛选处理结果"><button class="filter active" data-status="全部" aria-pressed="true">全部</button><button class="filter" data-status="待处理" aria-pressed="false">待处理</button><button class="filter" data-status="已解决" aria-pressed="false">已解决</button><button class="filter" data-status="无需处理" aria-pressed="false">无需处理</button></div><span class="sort-note" id="list-summary" aria-live="polite">最新提交在前</span></div>
<p id="list-message" role="status" class="list-message"></p><div id="feedback-list" aria-live="polite"></div>
</section>
</main><footer><span class="footer-brand">提交反馈</span><span>让每一次反馈，推动一点改变。</span></footer>
<dialog id="attachment-preview" aria-labelledby="preview-title"><div class="preview-shell"><div class="preview-header"><h2 id="preview-title">附件预览</h2><button id="preview-close" type="button" aria-label="关闭附件预览">×</button></div><div id="preview-content" class="preview-content" aria-live="polite"></div><div class="preview-footer"><a id="preview-download" target="_blank" rel="noopener noreferrer">下载附件</a></div></div></dialog>
</body></html>
