<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3158de"><meta name="description" content="提交需求和问题，查看每一条反馈的处理进展。"><title>反馈站 · 每个声音都有回响</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./config.js" defer></script><script src="./app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="反馈站首页"><span class="brand-icon">f<span>·</span></span>反馈站</a><span class="header-note">倾听 · 记录 · 改进</span></header>
<main>
<section class="intro"><p class="eyebrow">FEEDBACK, FOR BETTER.</p><h1>让你的想法，<br class="mobile-break">成为下一次改进。</h1><p class="lead">遇到了问题，或有一个好想法？告诉我们，<br class="desktop-break">在这里查看每一条反馈的进展。</p><div class="intro-mark" aria-hidden="true"><span></span><span></span><span></span></div></section>
<section class="submit-panel" aria-labelledby="submit-title">
<div class="panel-heading"><div><h2 id="submit-title">提交反馈</h2><p>具体的描述，能帮助我们更快理解你的想法。</p></div><span class="panel-tag">你的声音很重要</span></div>
<form id="feedback-form">
<label class="field-label" for="description">反馈描述 <span class="required">*</span></label>
<textarea id="description" name="description" rows="5" maxlength="5000" required placeholder="请描述你的需求或遇到的问题。若是问题，建议补充操作步骤和预期结果。" aria-describedby="description-count"></textarea><div class="field-meta"><span>请勿填写密码、密钥或其他敏感信息。</span><span id="description-count">0 / 5000</span></div>
<fieldset><legend class="field-label">类型 <span class="required">*</span></legend><div class="type-options"><label class="type-option"><input type="radio" name="type" value="需求" checked><span class="type-symbol">✦</span><span><strong>需求</strong><small>我有一个改进建议</small></span><span class="radio-mark"></span></label><label class="type-option"><input type="radio" name="type" value="问题"><span class="type-symbol">⌁</span><span><strong>问题</strong><small>我遇到了使用问题</small></span><span class="radio-mark"></span></label></div></fieldset>
<div class="attachment-field"><label class="field-label" for="attachments">上传附件 <span class="optional">选填</span></label><label class="upload-area" for="attachments"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 12.5 14.5 6a3 3 0 0 1 4.2 4.2L10 19a5 5 0 0 1-7-7l9-9"/><path d="m6.5 14 8-8"/></svg><span><strong>点击上传，或将文件拖到这里</strong><small>图片、PDF、TXT、日志或 ZIP · 最多 5 个，共 10 MB</small></span><input id="attachments" name="attachments" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.log,.zip"></label><ul id="file-list" class="file-list"></ul></div>
<div class="form-bottom"><div class="default-status"><span class="status pending">待处理</span><span>提交后的初始状态，处理结果由维护者更新</span></div><button class="primary-button" id="submit-button" type="submit">提交反馈</button></div>
<p class="public-note">反馈描述与附件会公开展示，请勿上传私人资料。</p><p id="form-message" class="form-message" role="status" aria-live="polite"></p>
<div class="honey" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
</form></section>
<section class="feedback-section" aria-labelledby="list-title"><div class="list-heading"><div><h2 id="list-title">反馈记录 <span id="total-count" class="count">0</span></h2><p>每一条反馈，都值得被认真对待。</p></div><button class="refresh-button" id="refresh" type="button">↻ 刷新列表</button></div>
<div class="list-toolbar"><div class="filters" role="group" aria-label="筛选处理结果"><button class="filter active" data-status="全部" aria-pressed="true">全部</button><button class="filter" data-status="待处理" aria-pressed="false">待处理</button><button class="filter" data-status="已解决" aria-pressed="false">已解决</button><button class="filter" data-status="无需处理" aria-pressed="false">无需处理</button></div><span class="sort-note">最新提交在前</span></div>
<p id="list-message" role="status" class="list-message"></p><div id="feedback-list" aria-live="polite"></div>
</section>
</main><footer><span class="footer-brand">反馈站</span><span>让每一次反馈，推动一点改变。</span></footer>
</body></html>
